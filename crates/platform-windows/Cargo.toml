[package]
name = "rust-ime-windows"
version.workspace = true
edition.workspace = true

[lib]
name = "rust_ime_tsf_v3"
crate-type = ["cdylib", "rlib"]

[dependencies]
rust-ime-core = { path = "../core" }
rust-ime-engine = { path = "../engine" }
rust-ime-ui = { path = "../ui" }
rust-ime-resources = { path = "../resources" }
serde = { workspace = true }
serde_json.workspace = true
log.workspace = true
thiserror.workspace = true
tokio.workspace = true
slint = "1.9"
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Console",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_Media",
    "Win32_Media_Audio",
    "implement",
] }
windows-core = "0.52"
notify-rust = "4"
reqwest = { version = "0.12", features = ["blocking"] }
urlencoding = "2.1"
open = "5.1"
image = "0.24"
arboard = "3.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time", "local-time"] }

[build-dependencies]
slint-build = "1.9"
winres = "0.1.12"
embed-resource = "1.8"

[[bin]]
name = "rust-ime"
path = "src/main.rs"
